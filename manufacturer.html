<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlockVerify | Manufacturer</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <header>

        <div class="logo">
            BlockVerify
        </div>

        <button id="connectWallet">
            Connect Wallet
        </button>

    </header>


    <main>

        <section class="manufacturer">

            <h1>
                Manufacturer Dashboard
            </h1>

            <p class="subtitle">
                Register a new product on the blockchain
            </p>


            <!-- Registration Form -->

            <div class="form-container">

                <h2>
                    Register Product
                </h2>


                <label for="productName">
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                >


                <label for="serialNumber">
                    Serial Number
                </label>

                <input
                    type="text"
                    id="serialNumber"
                    placeholder="Enter serial number"
                >


                <label for="batchNumber">
                    Batch Number
                </label>

                <input
                    type="text"
                    id="batchNumber"
                    placeholder="Enter batch number"
                >


                <label for="category">
                    Product Category
                </label>

                <input
                    type="text"
                    id="category"
                    placeholder="Enter product category"
                >


                <button
                    class="primary-button"
                    onclick="registerProduct()"
                >
                    Register Product
                </button>

            </div>


            <!-- Registration Result -->

            <div
                id="result"
                class="result"
            >
            </div>


            <!-- QR Code Section -->

            <div
                id="qrSection"
                class="qr-section"
                style="display: none;"
            >

                <h2>
                    Product QR Code
                </h2>

                <p>
                    Scan this QR code to verify the product.
                </p>


                <div id="qrcode"></div>


                <p id="qrUrl">
                </p>


                <button
                    id="downloadQR"
                    class="primary-button"
                    onclick="downloadQRCode()"
                >
                    Download QR Code
                </button>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 BlockVerify | Powered by Blockchain
        </p>

    </footer>


    <!-- ethers.js -->

    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>


    <!-- QR Code Library -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <!-- Blockchain connection -->

    <script src="js/blockchain.js"></script>


    <!-- Manufacturer functionality -->

    <script src="js/manufacturer.js"></script>


</body>

</html>
